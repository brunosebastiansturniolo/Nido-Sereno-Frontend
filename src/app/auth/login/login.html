<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-50 to-teal-100 px-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-emerald-700">🌿 Nido Sereno</h1>
      <p class="text-gray-500 mt-2">Iniciá sesión para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition"
          placeholder="tu@email.com"
        />
        <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-red-500 text-xs mt-1">
          Ingresá un email válido
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition"
          placeholder="••••••••"
        />
        <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-red-500 text-xs mt-1">
          Mínimo 8 caracteres
        </p>
      </div>

      <p *ngIf="error" class="text-red-500 text-sm text-center bg-red-50 p-2 rounded">{{ error }}</p>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-400 text-white font-semibold py-2 rounded-lg transition"
      >
        Iniciar sesión
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      ¿No tenés cuenta? <a routerLink="/register" class="text-emerald-600 hover:underline">Registrate</a>
    </p>
  </div>
</div>
