<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-50 to-teal-50 px-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-emerald-500">🌿 Nido Sereno</h1>
      <p class="text-gray-500 mt-2">Creá tu cuenta</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
          <input type="text" formControlName="firstName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-400 outline-none placeholder:text-gray-400 placeholder:italic" placeholder="Juan" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Apellido</label>
          <input type="text" formControlName="lastName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-400 outline-none placeholder:text-gray-400 placeholder:italic" placeholder="Pérez" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" formControlName="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-400 outline-none placeholder:text-gray-400 placeholder:italic" placeholder="tu@email.com" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password" formControlName="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-400 outline-none placeholder:text-gray-400 placeholder:italic" placeholder="Mínimo 8 caracteres" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
        <input type="password" formControlName="confirmPassword" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-400 outline-none placeholder:text-gray-400 placeholder:italic" placeholder="Repetí la contraseña" />
      </div>

      <p *ngIf="error" class="text-red-500 text-sm text-center bg-red-50 p-2 rounded">{{ error }}</p>
      <p *ngIf="success" class="text-emerald-500 text-sm text-center bg-emerald-50 p-2 rounded">{{ success }}</p>
      <p *ngIf="registerForm.get('confirmPassword')?.hasError('passwordsMismatch')" class="text-red-500 text-sm text-center bg-red-50 p-2 rounded">Las contraseñas no coinciden</p>

      <button type="submit" [disabled]="registerForm.invalid || loading" class="w-full bg-emerald-500 hover:bg-emerald-600 disabled:bg-gray-400 text-white font-semibold py-2 rounded-lg transition flex items-center justify-center gap-2">
        <svg *ngIf="loading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span *ngIf="loading">Registrando...</span>
        <span *ngIf="!loading">Registrarse</span>
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      ¿Ya tenés cuenta? <a routerLink="/login" class="text-emerald-500 hover:underline">Iniciá sesión</a>
    </p>
  </div>
</div>
