<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-50 to-teal-50 px-4 py-8">
  <div class="bg-white rounded-xl lg:rounded-2xl shadow-xl p-6 lg:p-8 w-full max-w-md">
    <h1 class="text-2xl lg:text-3xl font-bold text-emerald-500 text-center mb-2"><img src="nido-sereno-logo.svg" alt="" class="mx-auto mb-2 h-16 w-16 rounded-xl">Nido Sereno</h1>

    <div *ngIf="completed" class="text-center py-6">
      <p class="text-emerald-700">Tu contraseña fue actualizada correctamente.</p>
      <p class="text-gray-500 text-sm mt-2">Redirigiendo al inicio de sesión...</p>
    </div>

    <div *ngIf="!completed">
      <h2 class="text-lg font-semibold text-gray-700 text-center mb-2">Crear nueva contraseña</h2>
      <p class="text-gray-500 text-sm text-center mb-6">El enlace es válido durante 30 minutos y solo se puede usar una vez.</p>

      <form *ngIf="token" (ngSubmit)="submit()" #resetForm="ngForm" class="space-y-4">
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Nueva contraseña</label>
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            required
            minlength="8"
            autocomplete="new-password"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 outline-none"
            placeholder="Mínimo 8 caracteres"
          />
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
          <input
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            minlength="8"
            autocomplete="new-password"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 outline-none"
            placeholder="Repetí la contraseña"
          />
        </div>

        <p *ngIf="error" class="text-red-500 text-sm text-center bg-red-50 p-2 rounded">{{ error }}</p>

        <button
          type="submit"
          [disabled]="resetForm.invalid || loading"
          class="w-full bg-emerald-500 hover:bg-emerald-600 disabled:bg-gray-400 text-white font-semibold py-3 rounded-lg transition"
        >
          {{ loading ? 'Actualizando...' : 'Cambiar contraseña' }}
        </button>
      </form>

      <p *ngIf="error && !token" class="text-red-500 text-sm text-center bg-red-50 p-2 rounded">{{ error }}</p>
      <p class="text-center text-sm text-gray-500 mt-6">
        <a routerLink="/forgot-password" class="text-emerald-500 hover:underline">Solicitar un enlace nuevo</a>
      </p>
    </div>
  </div>
</div>
