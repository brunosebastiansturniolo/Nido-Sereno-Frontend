<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-50 to-teal-100 px-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md text-center">
    <h1 class="text-3xl font-bold text-emerald-700 mb-4">🌿 Nido Sereno</h1>

    <div *ngIf="loading" class="py-8">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-600 mx-auto"></div>
      <p class="text-gray-500 mt-4">Activando tu cuenta...</p>
    </div>

    <div *ngIf="!loading && success" class="py-8">
      <div class="text-5xl mb-4">✅</div>
      <p class="text-emerald-600 text-lg">{{ success }}</p>
      <p class="text-gray-400 text-sm mt-2">Redirigiendo al login...</p>
    </div>

    <div *ngIf="!loading && error" class="py-8">
      <div class="text-5xl mb-4">❌</div>
      <p class="text-red-500 text-lg">{{ error }}</p>
      <a routerLink="/login" class="text-emerald-600 hover:underline mt-4 inline-block">Ir al login</a>
    </div>
  </div>
</div>
