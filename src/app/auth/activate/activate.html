<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-emerald-50 to-teal-50 px-4 py-8">
  <div class="bg-white rounded-xl lg:rounded-2xl shadow-xl p-6 lg:p-8 w-full max-w-md text-center">
    <h1 class="text-2xl lg:text-3xl font-bold text-emerald-500 mb-2"><img src="nido-sereno-logo.svg" alt="" class="mx-auto mb-2 h-16 w-16 rounded-xl">Nido Sereno</h1>

    <div *ngIf="success" class="py-6 lg:py-8">
      <div class="text-4xl lg:text-5xl mb-4">✅</div>
      <p class="text-emerald-500 text-base lg:text-lg">{{ success }}</p>
      <p class="text-gray-400 text-sm mt-2">Redirigiendo al login...</p>
    </div>

    <div *ngIf="!success">
      <h2 class="text-lg lg:text-xl font-semibold text-gray-700 mb-2">Activar cuenta</h2>
      <p class="text-gray-500 text-sm mb-2">Ingresá el código de 6 dígitos que recibiste por correo.</p>
      <p class="text-amber-500 text-xs mb-4 lg:mb-6">⏳ El correo puede demorar aproximadamente 5 minutos en llegar.</p>

      <form (ngSubmit)="submitCode()" class="space-y-3 lg:space-y-4">
        <div>
          <input
            type="text"
            inputmode="numeric"
            [(ngModel)]="token"
            name="token"
            maxlength="6"
            pattern="[0-9]{6}"
            placeholder="123456"
            class="w-full text-center text-2xl lg:text-3xl tracking-[0.5em] font-mono px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 placeholder:text-gray-400 placeholder:italic"
          />
        </div>

        <p *ngIf="error" class="text-red-500 text-sm bg-red-50 p-2 rounded">{{ error }}</p>

        <button
          type="submit"
          [disabled]="loading || !token.trim()"
          class="w-full bg-emerald-500 hover:bg-emerald-600 disabled:bg-gray-400 text-white font-semibold py-3 rounded-lg transition text-base lg:text-sm"
        >
          <span *ngIf="loading">Activando...</span>
          <span *ngIf="!loading">Activar cuenta</span>
        </button>
      </form>

      <div class="mt-4 lg:mt-6 text-sm text-gray-400">
        <p>¿No recibiste el código? Revisá tu bandeja de spam o</p>
        <a routerLink="/register" class="text-emerald-500 hover:underline">registrate de nuevo</a>
      </div>
    </div>
  </div>
</div>
