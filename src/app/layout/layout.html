<div class="flex h-screen bg-gray-100">
  <!-- Sidebar -->
  <aside [class.w-64]="sidebarOpen" [class.w-16]="!sidebarOpen" class="bg-emerald-800 text-white flex flex-col transition-all duration-300">
    <!-- Logo -->
    <div class="p-4 flex items-center justify-between border-b border-emerald-700">
      <span *ngIf="sidebarOpen" class="text-xl font-bold">🌿 Nido Sereno</span>
      <button (click)="sidebarOpen = !sidebarOpen" class="p-1 hover:bg-emerald-700 rounded">
        {{ sidebarOpen ? '◀' : '▶' }}
      </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 py-4">
      <a *ngIf="hasRole('SUPER_ADMIN')" routerLink="/dashboard/admin" routerLinkActive="bg-emerald-700" class="flex items-center px-4 py-3 hover:bg-emerald-700 transition cursor-pointer">
        <span class="text-lg">📊</span>
        <span *ngIf="sidebarOpen" class="ml-3">Dashboard (Admin)</span>
      </a>

      <a *ngIf="hasRole('OWNER')" routerLink="/dashboard" routerLinkActive="bg-emerald-700" class="flex items-center px-4 py-3 hover:bg-emerald-700 transition cursor-pointer">
        <span class="text-lg">📊</span>
        <span *ngIf="sidebarOpen" class="ml-3">Dashboard (Owner)</span>
      </a>

      <a *ngIf="hasRole('OWNER') || hasRole('SUPER_ADMIN')" routerLink="/dashboard/complexes" routerLinkActive="bg-emerald-700" class="flex items-center px-4 py-3 hover:bg-emerald-700 transition cursor-pointer">
        <span class="text-lg">🏢</span>
        <span *ngIf="sidebarOpen" class="ml-3">Complejos</span>
      </a>

      <a *ngIf="hasRole('OWNER') || hasRole('SUPER_ADMIN')" routerLink="/dashboard/departments" routerLinkActive="bg-emerald-700" class="flex items-center px-4 py-3 hover:bg-emerald-700 transition cursor-pointer">
        <span class="text-lg">🚪</span>
        <span *ngIf="sidebarOpen" class="ml-3">Departamentos</span>
      </a>

      <a *ngIf="hasRole('OWNER') || hasRole('SUPER_ADMIN')" routerLink="/dashboard/reservations" routerLinkActive="bg-emerald-700" class="flex items-center px-4 py-3 hover:bg-emerald-700 transition cursor-pointer">
        <span class="text-lg">📋</span>
        <span *ngIf="sidebarOpen" class="ml-3">Reservas</span>
      </a>

      <a *ngIf="hasRole('OWNER') || hasRole('SUPER_ADMIN')" routerLink="/dashboard/stays" routerLinkActive="bg-emerald-700" class="flex items-center px-4 py-3 hover:bg-emerald-700 transition cursor-pointer">
        <span class="text-lg">🛏️</span>
        <span *ngIf="sidebarOpen" class="ml-3">Estadías</span>
      </a>

      <a *ngIf="hasRole('OWNER') || hasRole('SUPER_ADMIN')" routerLink="/dashboard/tenants" routerLinkActive="bg-emerald-700" class="flex items-center px-4 py-3 hover:bg-emerald-700 transition cursor-pointer">
        <span class="text-lg">👥</span>
        <span *ngIf="sidebarOpen" class="ml-3">Inquilinos</span>
      </a>
    </nav>

    <!-- User info -->
    <div class="p-4 border-t border-emerald-700">
      <p *ngIf="sidebarOpen" class="text-sm truncate">{{ user?.fullName }}</p>
      <p *ngIf="sidebarOpen" class="text-xs text-emerald-300 truncate">{{ user?.email }}</p>
      <button (click)="logout()" class="mt-2 w-full bg-red-600 hover:bg-red-700 text-white text-sm py-1 rounded transition">
        <span *ngIf="sidebarOpen">Cerrar sesión</span>
        <span *ngIf="!sidebarOpen">🚪</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-auto">
    <router-outlet></router-outlet>
  </main>
</div>
