<div class="p-6">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">🚪 Departamentos</h1>

  <div class="bg-white rounded-xl shadow p-6 mb-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Crear departamento</h2>
    <form (ngSubmit)="onCreate()" [formGroup]="createForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <input formControlName="nombre" class="px-4 py-2 border rounded-lg" placeholder="Nombre" />
      <input formControlName="numeroPiezas" type="number" class="px-4 py-2 border rounded-lg" placeholder="Piezas" />
      <input formControlName="precioPorNoche" type="number" class="px-4 py-2 border rounded-lg" placeholder="Precio/noche" />
      <input formControlName="tamañoM2" type="number" class="px-4 py-2 border rounded-lg" placeholder="Tamaño m²" />
      <input formControlName="complexId" type="number" class="px-4 py-2 border rounded-lg" placeholder="ID Complejo" />
      <label class="flex items-center gap-2"><input type="checkbox" formControlName="incluyeCochera" /> Cochera</label>
      <label class="flex items-center gap-2"><input type="checkbox" formControlName="incluyeDesayuno" /> Desayuno</label>
      <label class="flex items-center gap-2"><input type="checkbox" formControlName="tieneWifi" /> WiFi</label>
      <label class="flex items-center gap-2"><input type="checkbox" formControlName="tienePileta" /> Pileta</label>
      <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg md:col-span-3">Crear departamento</button>
    </form>
  </div>

  <div class="bg-white rounded-xl shadow p-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Mis departamentos</h2>
    <div *ngIf="loading" class="text-gray-500">Cargando...</div>
    <div *ngIf="!loading && departments.length === 0" class="text-gray-400">No tenés departamentos aún.</div>
    <table *ngIf="!loading && departments.length > 0" class="w-full text-left">
      <thead><tr class="border-b"><th class="py-2 px-3 text-sm text-gray-500">Nombre</th><th class="py-2 px-3 text-sm text-gray-500">Piezas</th><th class="py-2 px-3 text-sm text-gray-500">Precio/noche</th><th class="py-2 px-3 text-sm text-gray-500">Disponible</th></tr></thead>
      <tbody>
        <tr *ngFor="let d of departments" class="border-b hover:bg-gray-50">
          <td class="py-2 px-3">{{ d.nombre }}</td>
          <td class="py-2 px-3">{{ d.numeroPiezas }}</td>
          <td class="py-2 px-3">$ {{ d.precioPorNoche }}</td>
          <td class="py-2 px-3">{{ d.disponible ? '✅' : '❌' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
