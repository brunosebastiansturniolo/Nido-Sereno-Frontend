<div class="p-6">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">🛏️ Estadías</h1>
  <div class="bg-white rounded-xl shadow p-6">
    <div *ngIf="loading" class="text-gray-500">Cargando...</div>
    <div *ngIf="!loading && stays.length === 0" class="text-gray-400">No tenés estadías aún.</div>
    <table *ngIf="!loading && stays.length > 0" class="w-full text-left">
      <thead><tr class="border-b"><th class="py-2 px-3 text-sm text-gray-500">Check-in</th><th class="py-2 px-3 text-sm text-gray-500">Check-out</th><th class="py-2 px-3 text-sm text-gray-500">Estado</th><th class="py-2 px-3 text-sm text-gray-500">Comentarios</th></tr></thead>
      <tbody>
        <tr *ngFor="let s of stays" class="border-b hover:bg-gray-50">
          <td class="py-2 px-3">{{ s.fechaHoraCheckInReal }}</td>
          <td class="py-2 px-3">{{ s.fechaHoraCheckOutReal || '—' }}</td>
          <td class="py-2 px-3"><span class="px-2 py-1 rounded text-xs font-semibold" [class.bg-green-100]="s.estado==='CHECKED_IN'" [class.bg-blue-100]="s.estado==='CHECKED_OUT'" [class.bg-yellow-100]="s.estado==='PENDING'">{{ s.estado }}</span></td>
          <td class="py-2 px-3">{{ s.comentariosCheckIn || '—' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
