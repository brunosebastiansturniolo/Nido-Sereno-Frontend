<div class="p-6">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">📋 Reservas</h1>

  <!-- Formulario crear reserva -->
  <div class="bg-white rounded-xl shadow p-6 mb-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Crear reserva</h2>
    <form (ngSubmit)="onCreate()" [formGroup]="createForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input formControlName="firstName" class="w-full px-4 py-2 border rounded-lg" placeholder="Ej: Juan" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Apellido</label>
        <input formControlName="lastName" class="w-full px-4 py-2 border rounded-lg" placeholder="Ej: Pérez" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Documento (DNI)</label>
        <input formControlName="documentNumber" class="w-full px-4 py-2 border rounded-lg" placeholder="Ej: 12345678" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
        <input formControlName="phoneNumber" class="w-full px-4 py-2 border rounded-lg" placeholder="Ej: 1155551234" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad de personas</label>
        <input formControlName="cantidadPersonas" type="number" min="1" class="w-full px-4 py-2 border rounded-lg" placeholder="Ej: 2" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Cantidad de vehículos</label>
        <input formControlName="cantidadVehiculos" type="number" min="0" class="w-full px-4 py-2 border rounded-lg" placeholder="Ej: 1" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Check-in</label>
        <input formControlName="fechaCheckIn" type="date" class="w-full px-4 py-2 border rounded-lg" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Check-out</label>
        <input formControlName="fechaCheckOut" type="date" class="w-full px-4 py-2 border rounded-lg" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Departamento</label>
        <select formControlName="departmentId" class="w-full px-4 py-2 border rounded-lg">
          <option value="" disabled>Seleccioná un departamento</option>
          <option *ngFor="let d of departments" [value]="d.id">{{ d.nombre }} ({{ d.precioPorNoche }}$/noche)</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Precio total ($)</label>
        <input formControlName="precioTotal" type="number" min="0" class="w-full px-4 py-2 border rounded-lg" placeholder="Ej: 45000" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Señal ($)</label>
        <input formControlName="montoSenia" type="number" min="0" class="w-full px-4 py-2 border rounded-lg" placeholder="Ej: 15000" />
      </div>
      <div class="md:col-span-3">
        <p *ngIf="error" class="text-red-500 text-sm bg-red-50 p-2 rounded">{{ error }}</p>
        <p *ngIf="success" class="text-emerald-500 text-sm bg-emerald-50 p-2 rounded">{{ success }}</p>
        <button type="submit" [disabled]="createForm.invalid" class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-400 text-white font-semibold py-2 rounded-lg transition mt-2">
          Crear reserva
        </button>
      </div>
    </form>
  </div>

  <!-- Lista de reservas -->
  <div class="bg-white rounded-xl shadow p-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Mis reservas</h2>
    <div *ngIf="loading" class="text-gray-500">Cargando...</div>
    <div *ngIf="!loading && reservations.length === 0" class="text-gray-400">No tenés reservas aún.</div>
    <div *ngIf="!loading && reservations.length > 0" class="overflow-x-auto">
    <table class="w-full text-left">
      <thead><tr class="border-b"><th class="py-2 px-3 text-sm text-gray-500">Nombre</th><th class="py-2 px-3 text-sm text-gray-500">DNI</th><th class="py-2 px-3 text-sm text-gray-500">Check-in</th><th class="py-2 px-3 text-sm text-gray-500">Check-out</th><th class="py-2 px-3 text-sm text-gray-500">Estado</th><th class="py-2 px-3 text-sm text-gray-500">Total</th><th class="py-2 px-3 text-sm text-gray-500">Acciones</th></tr></thead>
      <tbody>
        <tr *ngFor="let r of reservations" class="border-b hover:bg-gray-50">
          <td class="py-2 px-3">{{ r.firstName }} {{ r.lastName }}</td>
          <td class="py-2 px-3">{{ r.documentNumber }}</td>
          <td class="py-2 px-3">{{ r.fechaCheckIn }}</td>
          <td class="py-2 px-3">{{ r.fechaCheckOut }}</td>
          <td class="py-2 px-3">
            <span class="px-2 py-1 rounded text-xs font-semibold"
              [class.bg-yellow-100]="r.estado==='PENDING'"
              [class.bg-green-100]="r.estado==='CONFIRMED'"
              [class.bg-red-100]="r.estado==='CANCELLED'"
              [class.bg-blue-100]="r.estado==='CHECKED_IN'"
              [class.bg-gray-100]="r.estado==='COMPLETED'">
              {{ r.estado }}
            </span>
          </td>
          <td class="py-2 px-3">$ {{ r.precioTotal }}</td>
          <td class="py-2 px-3">
            <button *ngIf="r.estado !== 'CANCELLED' && r.estado !== 'CHECKED_IN' && r.estado !== 'COMPLETED'"
              (click)="onCancel(r.id)" class="text-red-600 hover:underline text-sm">Cancelar</button>
          </td>
        </tr>
      </tbody>
    </table>
    </div>
  </div>
</div>
