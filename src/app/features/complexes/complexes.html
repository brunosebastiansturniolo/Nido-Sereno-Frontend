<div class="p-6">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">🏢 Complejos</h1>

  <!-- Formulario crear -->
  <div class="bg-white rounded-xl shadow p-6 mb-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Crear complejo</h2>
    <form (ngSubmit)="onCreate()" [formGroup]="createForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <input formControlName="nombre" class="px-4 py-2 border rounded-lg placeholder:text-gray-400 placeholder:italic" placeholder="Nombre" />
      <input formControlName="ubicacion" class="px-4 py-2 border rounded-lg placeholder:text-gray-400 placeholder:italic" placeholder="Ubicación" />
      <input formControlName="descripcion" class="px-4 py-2 border rounded-lg placeholder:text-gray-400 placeholder:italic" placeholder="Descripción (opcional)" />
      <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg md:col-span-3">Crear complejo</button>
    </form>
  </div>

  <!-- Lista -->
  <div class="bg-white rounded-xl shadow p-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Mis complejos</h2>
    <div *ngIf="loading" class="text-gray-500">Cargando...</div>
    <div *ngIf="!loading && complexes.length === 0" class="text-gray-400">No tenés complejos aún.</div>
    <table *ngIf="!loading && complexes.length > 0" class="w-full text-left">
      <thead>
        <tr class="border-b">
          <th class="py-2 px-3 text-sm text-gray-500">Nombre</th>
          <th class="py-2 px-3 text-sm text-gray-500">Ubicación</th>
          <th class="py-2 px-3 text-sm text-gray-500">Descripción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of complexes" class="border-b hover:bg-gray-50">
          <td class="py-2 px-3">{{ c.nombre }}</td>
          <td class="py-2 px-3">{{ c.ubicacion }}</td>
          <td class="py-2 px-3">{{ c.descripcion || '—' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
